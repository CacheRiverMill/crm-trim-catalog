services:
  laravel-app:
    build:
      context: .                          # WAS: ./laravel — now repo root
      dockerfile: Dockerfile
    container_name: trim-catalog-app      # WAS: laravel-app-dev — renamed to avoid conflicts
    volumes:
      - .:/var/www                        # WAS: ./laravel:/var/www — dot = repo root
    working_dir: /var/www
    depends_on:
      - mysql-db
    expose:
      - "9000"
    env_file:
      - ./.env                            # WAS: ./laravel/.env — .env is now at root

  nginx:
    image: nginx:latest
    container_name: trim-catalog-nginx    # WAS: laravel-nginx-dev — renamed
    ports:
      - "8001:80"                         # unchanged — 8001 reserved for Trim Catalog
    volumes:
      - .:/var/www                        # WAS: ./laravel:/var/www
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf  # unchanged
    depends_on:
      - laravel-app

  mysql-db:
    image: mysql:8.0
    container_name: trim-catalog-mysql    # WAS: mysql-db-dev — renamed
    ports:
      - "3308:3306"                       # WAS: 3307 — changed to avoid collision with monolith
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: trim_catalog        # WAS: laravel — renamed to match new app
    volumes:
      - trim_db_data:/var/lib/mysql       # WAS: db_data — renamed to be stack-specific

  node:
    image: node:18
    container_name: trim-catalog-node     # WAS: node-builder-dev — renamed
    working_dir: /var/www
    volumes:
      - .:/var/www                        # WAS: ./laravel:/var/www
    ports:
      - "5173:5173"                       # unchanged
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"  # unchanged

volumes:
  trim_db_data:                           # WAS: db_data — renamed to be stack-specific
